# ==============================================================================
# SwiftRide — Codemagic CI/CD Configuration
# Automates testing, analysis, building, and distribution for iOS and Android
# ==============================================================================

workflows:
  # --------------------------------------------------------------------------
  # 1. iOS Release & App Store / TestFlight Pipeline
  # --------------------------------------------------------------------------
  ios-release:
    name: Swift Ride — iOS Release (TestFlight & App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Configured in Codemagic UI (APP_STORE_CONNECT_KEY_IDENTIFIER, etc.)
        - firebase_credentials  # App Check and Firebase Secrets
      # REQUIRED (encrypted, set in Codemagic UI > Environment variables):
      #   GOOGLE_MAPS_IOS_API_KEY  — Google Maps key restricted to
      #                              iOS apps + bundle com.dartnexuslab.swiftride
      #                              + Maps SDK for iOS only.
      # The key is injected into ios/Flutter/Secrets.xcconfig at build time and
      # never committed to the repository.
      vars:
        BUNDLE_ID: "com.dartnexuslab.swiftride"
        APP_NAME: "Swift Ride"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Verify Flutter & Xcode Environment
        script: |
          flutter doctor -v
          xcodebuild -version
          pod --version

      - name: Install Dependencies
        script: |
          flutter pub get

      - name: Run Static Analysis & Unit Tests
        script: |
          flutter analyze
          flutter test

      - name: Set up iOS Code Signing & Provisioning Profiles
        script: |
          # Fetch signing files automatically via App Store Connect API if configured
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create || echo "Continuing with local or manual profile configuration..."
          keychain add-certificates || true

      - name: Inject Google Maps iOS API Key
        script: |
          # The key is never committed. Set GOOGLE_MAPS_IOS_API_KEY as an encrypted
          # variable in Codemagic (App settings > Environment variables).
          if [ -z "${GOOGLE_MAPS_IOS_API_KEY:-}" ]; then
            echo "ERROR: GOOGLE_MAPS_IOS_API_KEY is not configured in Codemagic."
            echo "Add it under Environment variables, then re-run this build."
            exit 1
          fi
          printf 'GMS_API_KEY = %s\n' "$GOOGLE_MAPS_IOS_API_KEY" > ios/Flutter/Secrets.xcconfig
          echo "Wrote ios/Flutter/Secrets.xcconfig for build-time Info.plist substitution."

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Release IPA
        script: |
          BUILD_NUM=${BUILD_NUMBER:-$(date +%s)}
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUM

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - dev@swiftride.app
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - Early Drivers
        expire_in_days: 90

  # --------------------------------------------------------------------------
  # 2. Android Release Pipeline (App Bundle / APK)
  # --------------------------------------------------------------------------
  android-release:
    name: Swift Ride — Android Production Bundle (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play_credentials
      # REQUIRED (encrypted, set in Codemagic UI > Environment variables):
      #   GOOGLE_MAPS_ANDROID_API_KEY — Google Maps key restricted to
      #                                 Android apps + package com.dartnexuslab.swiftride
      #                                 + signing SHA-1 + Maps SDK for Android only.
      vars:
        PACKAGE_NAME: "com.dartnexuslab.swiftride"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install Dependencies
        script: |
          flutter pub get

      - name: Run Tests
        script: |
          flutter analyze
          flutter test

      - name: Inject Google Maps Android API Key
        script: |
          # The key is never committed. Set GOOGLE_MAPS_ANDROID_API_KEY as an encrypted
          # variable in Codemagic (App settings > Environment variables).
          # Restrict it to: Android apps + package com.dartnexuslab.swiftride
          # + your signing SHA-1, and the Maps SDK for Android API only.
          if [ -z "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ]; then
            echo "ERROR: GOOGLE_MAPS_ANDROID_API_KEY is not configured in Codemagic."
            echo "Add it under Environment variables, then re-run this build."
            exit 1
          fi
          touch android/local.properties
          grep -v '^GOOGLE_MAPS_ANDROID_API_KEY=' android/local.properties > android/local.properties.tmp || true
          mv android/local.properties.tmp android/local.properties
          printf 'GOOGLE_MAPS_ANDROID_API_KEY=%s\n' "$GOOGLE_MAPS_ANDROID_API_KEY" >> android/local.properties
          echo "Injected Google Maps Android key into android/local.properties"

      - name: Build Release App Bundle (AAB) & Universal APK
        script: |
          BUILD_NUM=${BUILD_NUMBER:-$(date +%s)}
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUM
          flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUM

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - dev@swiftride.app
        notify:
          success: true
          failure: true
      google_play:
        track: internal
        submit_as_draft: true

  # --------------------------------------------------------------------------
  # 3. Pull Request Quality Gate (Fast CI)
  # --------------------------------------------------------------------------
  pr-quality-check:
    name: Swift Ride — PR Quality & Test Suite
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      flutter: stable
      node: 20
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Flutter Dependencies & Tests
        script: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Firebase Cloud Functions Tests (Vitest)
        script: |
          cd functions
          npm install
          npm test
          cd ..
