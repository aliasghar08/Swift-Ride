name: swiftride
description: "SwiftRide - Zero Commission Ride-Hailing Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_ai: ^4.0.0
  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.14.0
  google_maps_flutter_ios: ^2.10.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
