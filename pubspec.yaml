name: swiftride
description: "SwiftRide - Zero Commission Ride-Hailing Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_ai: ^4.0.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_ios: ^2.18.6
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
