name: swiftride
description: "SwiftRide - Zero Commission Ride-Hailing Platform"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_ai: ^4.0.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.7.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/ml/

  # Inter (SIL Open Font License 1.1) — see assets/fonts/LICENSE.txt.
  # Bundled as static instances so `fontWeight` maps deterministically instead of
  # relying on synthetic bolding.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
