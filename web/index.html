<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SwiftRide — ride hailing with 0% driver commission. Book a ride, track your driver live, and pay your way.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SwiftRide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SwiftRide</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API — required by google_maps_flutter_web.

    This key is a *client* key: it is unavoidably visible in the page source, so
    it MUST be restricted to this site's HTTP referrers in Google Cloud Console
    (APIs & Services > Credentials), with only "Maps JavaScript API" enabled.
    An unrestricted web key can be copied and billed against this project.
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2nnXL0LX6CbJkDKvHZZAabP34k36UvKE&loading=async&libraries=marker"
    async
    defer>
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
